<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
       content="width=device-width, initial-scale=1.0" />
  <title>Calculate Your E-Bike Percentage of Battery Power Remaining</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
       rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container py-5 d-flex justify-content-center">
    <!-- ✅ Light grey background for the form box -->
    <div class="card shadow p-4 w-100 w-md-50 w-lg-33 bg-secondary bg-opacity-10"
         style="max-width: 450px; font-size: 1.1rem;">

      <!-- Title (keeps normal size) -->
      <h1 class="text-center mb-4 fs-4">
        Calculate Your E-Bike Percentage of Battery Power Remaining
      </h1>

      <!-- Description -->
      <p class="text-muted">
        Enter your battery information below.<br />
        The defaults here are for a <strong>Lectric XP4 750</strong>, which has a 54.6v max charge (100%)
        and a recommended minimum of 42v (0%).<br />
        Use AI or Google to find the correct numbers for your specific battery.
      </p>

      <!-- Form -->
      <form id="batteryForm"
           class="mt-3">
        <div class="mb-3">
          <label for="minVolts"
               class="form-label">Battery Voltage (Min)</label>
          <input type="number"
               class="form-control bg-white"
               id="minVolts"
               value="42"
               step="0.1"
               required />
        </div>

        <div class="mb-3">
          <label for="maxVolts"
               class="form-label">Battery Voltage (Max)</label>
          <input type="number"
               class="form-control bg-white"
               id="maxVolts"
               value="54.6"
               step="0.1"
               required />
        </div>

        <div class="mb-3">
          <label for="currentVolts"
               class="form-label">Current Battery Voltage</label>
          <input type="number"
               class="form-control bg-white"
               id="currentVolts"
               step="0.1"
               placeholder="Enter your current voltage"
               required />
        </div>

        <button type="submit"
             class="btn btn-primary w-100 fs-5">Calculate</button>
      </form>

      <div id="result"
           class="alert alert-info text-center mt-4 fs-5"
           style="display: none;"></div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ External JS file -->
  <script src="percent.js"></script>
</body>

</html>
