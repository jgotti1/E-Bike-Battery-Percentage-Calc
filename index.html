<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
       content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>E-Bike Battery Calculator</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
       rel="stylesheet" />

  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --good: #16a34a;
      --warn: #f59e0b;
      --bad: #dc2626;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(160deg, #eff4ff 0%, #f8fafc 55%, #eef2f7 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Mobile first: the card fills the whole screen */
    .app-card {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 576px) {
      body {
        padding: 2rem 1rem;
      }

      .app-card {
        max-width: 440px;
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
    }

    .app-header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #fff;
      padding: calc(3rem + env(safe-area-inset-top)) 1.5rem 2.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .app-header .icon {
      flex: none;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.14);
      display: grid;
      place-items: center;
    }

    .app-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
      margin: 0;
    }

    .app-header p {
      margin: 0.4rem 0 0;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.72);
    }

    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2.25rem 1.5rem calc(1.75rem + env(safe-area-inset-bottom));
      background: #fff;
    }

    .form-label {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.6rem;
    }

    #batteryForm .mb-3 {
      margin-bottom: 1.75rem !important;
    }

    #batteryForm .mb-4 {
      margin-bottom: 2.25rem !important;
    }

    .form-text {
      color: var(--muted);
    }

    .form-control,
    .form-select,
    .input-group-text {
      border-color: var(--line);
      padding: 0.85rem 1rem;
      font-size: 1.125rem; /* 16px+ stops iOS zoom on focus */
      min-height: 3.5rem;
    }

    .input-group-text {
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
    }

    .btn-calc {
      background: var(--brand);
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 1.15rem;
      min-height: 3.75rem;
      padding: 0.75rem;
      transition: background 0.15s;
    }

    .btn-calc:hover,
    .btn-calc:focus {
      background: var(--brand-dark);
      color: #fff;
    }

    .result-box {
      margin-top: 1.5rem;
      padding: 1.5rem 1.25rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f8fafc;
      text-align: center;
    }

    .result-box[hidden] {
      display: none;
    }

    .result-percent {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .result-label {
      margin-top: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .gauge {
      height: 16px;
      margin: 1.25rem 0 0.75rem;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .result-meta {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .result-error {
      color: var(--bad);
      font-weight: 600;
    }

    .bike-art {
      flex: 1;
      min-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 1rem;
    }

    .bike-art svg {
      width: 100%;
      max-width: 380px;
      height: auto;
    }

    .bike-art .frame {
      stroke: #1e293b;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .bike-art .tire {
      stroke: #1e293b;
      stroke-width: 7;
      fill: none;
    }

    .bike-art .rim {
      stroke: #94a3b8;
      stroke-width: 1.5;
      fill: none;
    }

    #bikeFill {
      transition: width 0.5s ease, fill 0.3s;
    }

    .footnote {
      margin: auto 0 0;
      padding-top: 1.5rem;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="d-flex justify-content-center">
    <main class="app-card card w-100">

      <header class="app-header">
        <div class="icon"
             aria-hidden="true">
          <svg width="26"
               height="26"
               viewBox="0 0 24 24"
               fill="#fff">
            <path d="M13 2 4 14h6l-1 8 9-12h-6z" />
          </svg>
        </div>
        <div>
          <h1>E-Bike Battery Calculator</h1>
          <p>Estimate charge remaining from voltage</p>
        </div>
      </header>

      <div class="app-body">
        <form id="batteryForm"
             novalidate>
          <div class="mb-3">
            <label for="bike"
                 class="form-label">Choose your bike</label>
            <select class="form-select"
                 id="bike"></select>
          </div>

          <div class="mb-3"
               id="cellsGroup"
               hidden>
            <label for="cells"
                 class="form-label">Battery cells in series</label>
            <div class="input-group">
              <input type="number"
                   class="form-control"
                   id="cells"
                   value="13"
                   min="1"
                   step="1"
                   inputmode="numeric"
                   required />
              <span class="input-group-text">cells</span>
            </div>
            <div class="form-text">Typically 13 for a 48V pack, 14 for 52V, 10 for 36V.</div>
          </div>

          <div class="mb-4">
            <label for="currentVolts"
                 class="form-label">Current battery voltage</label>
            <div class="input-group">
              <input type="number"
                   class="form-control"
                   id="currentVolts"
                   step="any"
                   inputmode="decimal"
                   placeholder="e.g. 50.4"
                   required />
              <span class="input-group-text">V</span>
            </div>
          </div>

          <button type="submit"
               class="btn btn-calc w-100">Calculate</button>
        </form>

        <div id="result"
             class="result-box"
             role="status"
             aria-live="polite"
             hidden></div>

        <div class="bike-art"
             aria-hidden="true">
          <svg viewBox="0 0 320 170">
            <ellipse cx="160" cy="162" rx="135" ry="5" fill="#e2e8f0" />
            <!-- wheels -->
            <circle class="tire" cx="70" cy="118" r="38" />
            <circle class="rim" cx="70" cy="118" r="30" />
            <circle class="tire" cx="250" cy="118" r="38" />
            <circle class="rim" cx="250" cy="118" r="30" />
            <path class="rim" d="M70 88v60M40 118h60M49 97l42 42M91 97l-42 42M250 88v60M220 118h60M229 97l42 42M271 97l-42 42" />
            <!-- frame -->
            <path class="frame" d="M70 118 150 118 132 64 222 64 232 84 M150 118 222 70 M132 64 70 118 M232 84 250 118" />
            <!-- seat, bars -->
            <path class="frame" d="M120 54h26M132 64v-10M222 64l-4-22M206 42h28" />
            <!-- hub motor and crank -->
            <circle cx="70" cy="118" r="11" fill="#2563eb" />
            <circle cx="150" cy="118" r="6" fill="#1e293b" />
            <!-- battery pack on the down tube -->
            <g transform="translate(186 95) rotate(-33.7)">
              <rect x="-33" y="-10" width="66" height="20" rx="6" fill="#0f172a" />
              <rect id="bikeFill"
                    x="-29"
                    y="-6"
                    width="58"
                    height="12"
                    rx="3"
                    fill="#2563eb" />
            </g>
          </svg>
        </div>

        <p class="footnote">
          Lithium voltage isn't linear, so this uses a per-cell discharge curve. Measure with the bike at rest
          for the best accuracy, since voltage sags under load.
        </p>
      </div>
    </main>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="percent.js"></script>

  <!-- Vercel Web Analytics (enable under the project's Analytics tab) -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
