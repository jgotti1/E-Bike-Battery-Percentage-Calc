<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
       content="width=device-width, initial-scale=1.0" />
  <title>E-Bike Battery Calculator</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
       rel="stylesheet" />

  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --good: #16a34a;
      --warn: #f59e0b;
      --bad: #dc2626;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(160deg, #eff4ff 0%, #f8fafc 55%, #eef2f7 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .app-card {
      max-width: 440px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .app-header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #fff;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .app-header .icon {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      display: grid;
      place-items: center;
    }

    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }

    .app-header p {
      margin: 0.15rem 0 0;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.72);
    }

    .app-body {
      padding: 1.5rem;
      background: #fff;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.35rem;
    }

    .form-text {
      color: var(--muted);
    }

    .form-control,
    .form-select,
    .input-group-text {
      border-color: var(--line);
      padding: 0.65rem 0.85rem;
    }

    .input-group-text {
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
    }

    .btn-calc {
      background: var(--brand);
      border: 0;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      padding: 0.75rem;
      transition: background 0.15s;
    }

    .btn-calc:hover,
    .btn-calc:focus {
      background: var(--brand-dark);
      color: #fff;
    }

    .result-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f8fafc;
      text-align: center;
    }

    .result-box[hidden] {
      display: none;
    }

    .result-percent {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .result-label {
      margin-top: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .gauge {
      height: 12px;
      margin: 1rem 0 0.75rem;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .result-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .result-error {
      color: var(--bad);
      font-weight: 600;
    }

    .footnote {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="container py-4 py-md-5 d-flex justify-content-center">
    <main class="app-card card w-100">

      <header class="app-header">
        <div class="icon"
             aria-hidden="true">
          <svg width="26"
               height="26"
               viewBox="0 0 24 24"
               fill="#fff">
            <path d="M13 2 4 14h6l-1 8 9-12h-6z" />
          </svg>
        </div>
        <div>
          <h1>E-Bike Battery Calculator</h1>
          <p>Estimate charge remaining from voltage</p>
        </div>
      </header>

      <div class="app-body">
        <form id="batteryForm"
             novalidate>
          <div class="mb-3">
            <label for="bike"
                 class="form-label">Choose your bike</label>
            <select class="form-select"
                 id="bike"></select>
          </div>

          <div class="mb-3"
               id="cellsGroup"
               hidden>
            <label for="cells"
                 class="form-label">Battery cells in series</label>
            <div class="input-group">
              <input type="number"
                   class="form-control"
                   id="cells"
                   value="13"
                   min="1"
                   step="1"
                   inputmode="numeric"
                   required />
              <span class="input-group-text">cells</span>
            </div>
            <div class="form-text">Typically 13 for a 48V pack, 14 for 52V, 10 for 36V.</div>
          </div>

          <div class="mb-4">
            <label for="currentVolts"
                 class="form-label">Current battery voltage</label>
            <div class="input-group">
              <input type="number"
                   class="form-control"
                   id="currentVolts"
                   step="any"
                   inputmode="decimal"
                   placeholder="e.g. 50.4"
                   required />
              <span class="input-group-text">V</span>
            </div>
          </div>

          <button type="submit"
               class="btn btn-calc w-100">Calculate</button>
        </form>

        <div id="result"
             class="result-box"
             role="status"
             aria-live="polite"
             hidden></div>

        <p class="footnote">
          Lithium voltage isn't linear, so this uses a per-cell discharge curve. Measure with the bike at rest
          for the best accuracy, since voltage sags under load.
        </p>
      </div>
    </main>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="percent.js"></script>
</body>

</html>
